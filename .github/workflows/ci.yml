name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  NPM_VERSION: '10'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage (if configured)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  auth-e2e:
    name: Auth E2E (Fail-Closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run auth E2E tests
        run: npm run test:e2e:auth

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, auth-e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          # Minimal env to allow build to complete (Vite requires these at build time)
          VITE_API_URL: /api
          VITE_USE_BACKEND_AI: 'true'
          VITE_FIREBASE_API_KEY: 'dummy-key-for-build'
          VITE_FIREBASE_AUTH_DOMAIN: 'dummy.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'dummy-project'
          VITE_FIREBASE_APP_ID: '1:123456789:web:abcdef'
          VITE_WS_PORT: '3001'

      - name: Verify no secrets in build output
        run: |
          if grep -r "VITE_GROQ_API_KEY\|VITE_OPENROUTER_API_KEY\|VITE_HF_TOKEN\|VITE_KILO_API_KEY" dist/ 2>/dev/null; then
            echo "::error::Provider API keys found in production build!"
            exit 1
          fi
          echo "✓ No provider keys in build output"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          # Scan tracked source for credential-shaped assignments. The value
          # must be a single token (no whitespace) so user-facing validation
          # copy such as "Enter your password." is not reported. Syntax-
          # highlighting maps are excluded: their `token: '<scope>'` entries
          # are grammar scopes, not credentials.
          if git ls-files -z -- . \
              ':(exclude).env.example' \
              ':(exclude)LICENSE' \
              ':(exclude)NOTICE' \
              ':(exclude)src/core/editor/azemaxDarkPlusTheme.ts' \
              ':(exclude)src/core/editor/darkPlusTokenizers/**' \
            | xargs -0 grep -l -E "(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*[\"'][^ \"']{8,}[\"']" 2>/dev/null; then
            echo "::error::Potential hardcoded secrets found in tracked files"
            exit 1
          fi
          echo "✓ No hardcoded secrets detected in tracked files"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high

  check-license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check license headers
        run: |
          # Check that source files have license headers (optional - warn only)
          MISSING=0
          for f in $(git ls-files '*.ts' '*.tsx' '*.cjs' | grep -v node_modules | grep -v dist); do
            if ! head -20 "$f" | grep -q "Apache License\|Copyright\|SPDX-License-Identifier"; then
              echo "Missing license header: $f"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo "::warning::Some source files may be missing license headers"
          fi
          echo "✓ License header check complete"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true