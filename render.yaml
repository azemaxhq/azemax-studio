services:
  - type: web
    name: azemax-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://www.azemax.com,https://azemax.com
      # --- Firebase Admin (REQUIRED in production) --------------------------
      # Firebase Authentication is the ONLY identity provider. The server
      # refuses to boot in production unless it can verify identity, so these
      # three values are mandatory (fail closed — there is no bypass flag).
      # From the Firebase console: Project settings -> Service accounts ->
      # "Generate new private key". Paste the three fields from the JSON:
      #   project_id -> FIREBASE_PROJECT_ID
      #   client_email -> FIREBASE_CLIENT_EMAIL
      #   private_key -> FIREBASE_PRIVATE_KEY (keep the escaped \n newlines)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: KILO_API_KEY
        sync: false
      - key: ALLOW_LOCAL_EXECUTION
        value: false
      - key: ALLOW_SHELL
        value: false
